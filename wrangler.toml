name = "massmurdercanada"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Admin password hash (PBKDF2) - generate with: node generate-password-hash.js "your-password"
# For production, use: npx wrangler secret put ADMIN_PASSWORD_HASH
# For remote agent ingestion, use: npx wrangler secret put INGEST_API_TOKEN
# For local development, uncomment the line below (but don't commit it to git!)
# ADMIN_PASSWORD_HASH = "paste-your-hash-here-for-local-dev-only"

[[d1_databases]]
binding = "DB"
database_name = "massmurdercanada"
database_id = "2096de9d-42d1-4430-bd6f-92ff79419f4e"

# Staging - Complete copy of production data, separate database for testing
[env.staging]
name = "massmurdercanada-staging"
# Note: ADMIN_PASSWORD_HASH should be set as a secret for staging:
# npx wrangler secret put ADMIN_PASSWORD_HASH --env staging

[env.staging.vars]
APP_ENV = "staging"
AI_SUMMARY_ENABLED = "true"
AI_SUMMARY_AUTO_ON_SAVE = "false"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_SUMMARY_STORIES_PER_JOB = "10"
AI_FETCH_JINA_FALLBACK = "true"
AI_FETCH_MARKDOWN_NEW_FALLBACK = "true"
AI_FETCH_SUMMARIZE_DAEMON_URL = ""
AI_LOCATION_ENABLED = "true"
AI_LOCATION_GEOCODE_ENABLED = "true"
AI_LOCATION_MIN_CONFIDENCE = "0.72"
INGEST_RATE_LIMIT_PER_MINUTE = "60"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "massmurdercanada"
database_id = "2096de9d-42d1-4430-bd6f-92ff79419f4e"

[[env.staging.kv_namespaces]]
binding = "AUTH_TOKENS"
id = "59d5407bc78348d9a620f9bb5cf2ed87"

[env.staging.ai]
binding = "AI"

[[env.staging.queues.producers]]
binding = "SUMMARY_QUEUE"
queue = "massmurdercanada-staging-summary"

[[env.staging.queues.consumers]]
queue = "massmurdercanada-staging-summary"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3

# Production
[env.production]
name = "massmurdercanada"
routes = [
  { pattern = "massmurdercanada.org/*", zone_name = "massmurdercanada.org" },
  { pattern = "www.massmurdercanada.org/*", zone_name = "massmurdercanada.org" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "massmurdercanada-prod"
database_id = "abc87d82-e184-4c27-b971-f36fa4784a79"

[[env.production.kv_namespaces]]
binding = "AUTH_TOKENS"
id = "d4b0879450f0411e9fd17a3dcdea4801"

[env.production.ai]
binding = "AI"

[[env.production.queues.producers]]
binding = "SUMMARY_QUEUE"
queue = "massmurdercanada-production-summary"

[[env.production.queues.consumers]]
queue = "massmurdercanada-production-summary"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

[env.production.vars]
APP_ENV = "production"
AI_SUMMARY_ENABLED = "true"
AI_SUMMARY_AUTO_ON_SAVE = "true"
AI_SUMMARY_STORIES_PER_JOB = "5"
AI_FETCH_JINA_FALLBACK = "true"
AI_FETCH_MARKDOWN_NEW_FALLBACK = "true"
AI_FETCH_SUMMARIZE_DAEMON_URL = ""
AI_LOCATION_ENABLED = "true"
AI_LOCATION_GEOCODE_ENABLED = "true"
AI_LOCATION_MIN_CONFIDENCE = "0.72"
INGEST_RATE_LIMIT_PER_MINUTE = "60"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
